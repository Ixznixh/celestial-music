<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Radiant linear gradient for the crescent moon -->
    <linearGradient id="moonGrad" x1="140" y1="371" x2="365" y2="141" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />   <!-- Deep Pink/Magenta -->
      <stop offset="40%" stop-color="#a855f7" />  <!-- Vibrant Violet/Purple -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Electric Blue -->
    </linearGradient>

    <!-- Glowing radial gradient for the star -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing radial gradient for the bottom dot -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for glowing effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background: full-bleed square with pitch-black background to blend seamlessly into device frames -->
  <rect width="512" height="512" fill="#030303" />
  <!-- Elegant inner squircle border frame safely inset to fit inside browser masks flawlessly -->
  <rect x="12" y="12" width="488" height="488" rx="108" stroke="#3b82f6" stroke-width="5.5" stroke-opacity="0.35" />

  <!-- Grouped central artwork scaled up by 36% to eliminate the excess black gap -->
  <g transform="translate(256, 256) scale(1.36) translate(-256, -256)">
    <!-- Outer ambient glow of the moon itself -->
    <path d="M 365,141 C 210,141 140,186 140,256 C 140,326 210,371 365,371 C 255,356 195,306 195,256 C 195,206 255,156 365,141 Z" fill="url(#moonGrad)" opacity="0.45" filter="url(#neonGlow)" />

    <!-- Crisp foreground moon -->
    <path d="M 365,141 C 210,141 140,186 140,256 C 140,326 210,371 365,371 C 255,356 195,306 195,256 C 195,206 255,156 365,141 Z" fill="url(#moonGrad)" />

    <!-- Bottom dot glow and dot -->
    <circle cx="365" cy="371" r="28" fill="url(#dotGlow)" />
    <circle cx="365" cy="371" r="9" fill="#ffffff" />

    <!-- Top star glow and star -->
    <!-- Ambient glow of the star -->
    <circle cx="365" cy="141" r="45" fill="url(#starGlow)" />
    <!-- Crisp 4-pointed star -->
    <path d="M 365,116 L 369,137 L 390,141 L 369,145 L 365,166 L 361,145 L 340,141 L 361,137 Z" fill="#ffffff" />
  </g>
</svg>
