<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="luma-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b10" />
      <stop offset="50%" stop-color="#14141e" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="luma-wave-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#ba38f0" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="luma-wave-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#luma-bg)" />

  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="256" r="170" fill="url(#luma-wave-1)" opacity="0.18" filter="url(#glow)" />

  <!-- Celestial Luminous Sound Waves -->
  <!-- Outer ring wave -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#luma-wave-2)" stroke-width="6" opacity="0.4" stroke-dasharray="12 18" />

  <!-- Dynamic waveform core -->
  <g transform="translate(256, 256)">
    <!-- Central resonant sound pulses -->
    <rect x="-100" y="-36" width="18" height="72" rx="9" fill="url(#luma-wave-1)" opacity="0.85" />
    <rect x="-68" y="-64" width="18" height="128" rx="9" fill="url(#luma-wave-1)" opacity="0.95" />
    <rect x="-36" y="-96" width="18" height="192" rx="9" fill="url(#luma-wave-1)" />
    <rect x="-4" y="-120" width="18" height="240" rx="9" fill="url(#luma-wave-2)" filter="url(#glow)" />
    <rect x="28" y="-88" width="18" height="176" rx="9" fill="url(#luma-wave-2)" />
    <rect x="60" y="-52" width="18" height="104" rx="9" fill="url(#luma-wave-2)" opacity="0.9" />
    <rect x="92" y="-28" width="18" height="56" rx="9" fill="url(#luma-wave-2)" opacity="0.75" />
  </g>

  <!-- Specular highlight point -->
  <circle cx="251" cy="142" r="7" fill="#ffffff" opacity="0.9" />
</svg>
